# Proiectul Xcode se generează din acest fișier cu XcodeGen (rulat automat de GitHub Actions, înainte de fiecare build).
name: Lozuri
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  Lozuri:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        # Schimbă cu Bundle ID-ul tău, identic cu cel din App Store Connect.
        PRODUCT_BUNDLE_IDENTIFIER: ro.draghicioiu.lozuri
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Config/Lozuri.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Lozuri
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
